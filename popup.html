<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enhance</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <main class="app">
    <div class="top">
      <div>
        <h1>Enhance</h1>
        <p id="statusText">Video enhancement is off</p>
      </div>

      <label class="switch">
        <input id="enhanceToggle" type="checkbox">
        <span class="slider"></span>
      </label>
    </div>

    <button id="compareButton" class="compare-button" disabled>
      <span class="compare-icon">
        <span></span>
      </span>

      <span class="compare-copy">
        <strong>Before & After</strong>
        <small>Compare original and enhanced video</small>
      </span>

      <span class="arrow">›</span>
    </button>

    <div class="footer">
      <span class="dot"></span>
      <span>Works automatically on YouTube</span>
    </div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
