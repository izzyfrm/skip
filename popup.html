<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enhance</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <main class="app">
    <div class="top">
      <div>
        <h1>Enhance</h1>
        <p id="statusText">Video enhancement is off</p>
      </div>

      <label class="switch">
        <input id="enhanceToggle" type="checkbox">
        <span class="switch-ui"></span>
      </label>
    </div>

    <button id="compareButton" class="compare-button" disabled>
      <span class="compare-icon">
        <span></span>
      </span>

      <span class="compare-copy">
        <strong>Before & After</strong>
        <small>Compare original and enhanced video</small>
      </span>

      <span class="arrow">›</span>
    </button>

    <div class="motion-card">
      <div class="motion-top">
        <div>
          <strong>Motion Blur</strong>
          <small>Smooth fast movement using frame blending</small>
        </div>

        <label class="switch small">
          <input id="motionToggle" type="checkbox">
          <span class="switch-ui"></span>
        </label>
      </div>

      <div id="strengthArea" class="strength-area">
        <div class="strength-header">
          <span>Strength</span>
          <span id="strengthValue">3</span>
        </div>

        <input
          id="strengthSlider"
          type="range"
          min="1"
          max="10"
          step="1"
          value="3"
        >

        <div class="range-labels">
          <span>Subtle</span>
          <span>Heavy</span>
        </div>
      </div>
    </div>

    <div class="footer">
      <span class="dot"></span>
      <span>Works automatically on YouTube</span>
    </div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
