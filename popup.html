<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <title>tune.</title>

  <link
    rel="stylesheet"
    href="popup.css"
  >
</head>

<body>

  <main>

    <header>

      <div>
        <h1>tune.</h1>
        <p>YouTube customization</p>
      </div>

      <label class="switch">

        <input
          id="enabled"
          type="checkbox"
        >

        <span></span>

      </label>

    </header>

    <section>

      <div class="row">

        <div>
          <strong>Accent</strong>
          <small>
            Player + UI highlights
          </small>
        </div>

        <input
          id="accent"
          type="color"
          value="#3b82f6"
        >

      </div>

      <div class="presets">

        <button
          data-color="#ff0033"
          class="red"
        ></button>

        <button
          data-color="#3b82f6"
          class="blue"
        ></button>

        <button
          data-color="#8b5cf6"
          class="purple"
        ></button>

        <button
          data-color="#22c55e"
          class="green"
        ></button>

        <button
          data-color="#ffffff"
          class="white"
        ></button>

      </div>

    </section>

    <section>

      <label class="row">

        <div>
          <strong>Rounded UI</strong>

          <small>
            Round thumbnails + player
          </small>
        </div>

        <input
          id="rounded"
          type="checkbox"
        >

      </label>

      <label class="row">

        <div>
          <strong>Channel overlay</strong>

          <small>
            Show creator on video
          </small>
        </div>

        <input
          id="channelOverlay"
          type="checkbox"
        >

      </label>

      <label class="row">

        <div>
          <strong>Hide Shorts</strong>

          <small>
            Remove Shorts from YouTube
          </small>
        </div>

        <input
          id="hideShorts"
          type="checkbox"
        >

      </label>

    </section>

    <footer>
      v0.1
    </footer>

  </main>

  <script src="popup.js"></script>

</body>
</html>
