<!DOCTYPE html>

<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>tune.</title>

  <link
    rel="stylesheet"
    href="popup.css"
  >

</head>

<body>

  <main class="app">

    <header class="header">

      <div class="brand">

        <div class="logo">
          t
        </div>

        <div>

          <h1>
            tune.
          </h1>

          <p>
            Customize YouTube
          </p>

        </div>

      </div>

      <label class="switch">

        <input
          id="enabled"
          type="checkbox"
        >

        <span class="slider"></span>

      </label>

    </header>

    <section class="card">

      <div class="section-title">
        Appearance
      </div>

      <div class="setting">

        <div>

          <strong>
            Accent color
          </strong>

          <span>
            Change YouTube highlights
          </span>

        </div>

        <input
          id="accent"
          type="color"
          value="#3b82f6"
        >

      </div>

      <div class="colors">

        <button
          class="color red"
          data-color="#ff0033"
          aria-label="Red"
        ></button>

        <button
          class="color blue"
          data-color="#3b82f6"
          aria-label="Blue"
        ></button>

        <button
          class="color purple"
          data-color="#8b5cf6"
          aria-label="Purple"
        ></button>

        <button
          class="color green"
          data-color="#22c55e"
          aria-label="Green"
        ></button>

        <button
          class="color white"
          data-color="#ffffff"
          aria-label="White"
        ></button>

      </div>

    </section>

    <section class="card">

      <div class="section-title">
        Interface
      </div>

      <label class="setting">

        <div>

          <strong>
            Rounded UI
          </strong>

          <span>
            Smooth thumbnails and player
          </span>

        </div>

        <input
          id="rounded"
          class="check"
          type="checkbox"
        >

      </label>

      <label class="setting">

        <div>

          <strong>
            Channel overlay
          </strong>

          <span>
            Show creator on the player
          </span>

        </div>

        <input
          id="channelOverlay"
          class="check"
          type="checkbox"
        >

      </label>

      <label class="setting">

        <div>

          <strong>
            Hide Shorts
          </strong>

          <span>
            Remove Shorts shelves
          </span>

        </div>

        <input
          id="hideShorts"
          class="check"
          type="checkbox"
        >

      </label>

    </section>

    <footer>

      <span>
        tune.
      </span>

      <span>
        v0.2
      </span>

    </footer>

  </main>

  <script src="popup.js"></script>

</body>

</html>
